# This config is equivalent to both the '.circleci/extended/orb-free.yml' and the base '.circleci/config.yml'
version: 2.1

# Orbs are reusable packages of CircleCI configuration that you may share across projects, enabling you to create encapsulated, parameterized commands, jobs, and executors that can be used across multiple projects.
# See: https://circleci.com/docs/2.0/orb-intro/
orbs:
  codecov: codecov/codecov@6.0.0
  node: circleci/node@5.2.0

jobs:
  build-test-package:
    docker:
      - image: cimg/node:24.18.0
    steps:
      - checkout

      - run:
          name: Enable pinned pnpm
          command: corepack enable

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v4-pnpm-{{ checksum "pnpm-lock.yaml" }}
            # fallback to using the latest cache if no exact match is found
            - v4-pnpm-

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run security:audit

      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
          key: v4-pnpm-{{ checksum "pnpm-lock.yaml" }}

      - run: pnpm run lint
      - run: pnpm run prettier
      - run: pnpm run test:types
      - run: pnpm run build
      - run: pnpm run test:integration
      - run: pnpm run release:smoke

      # run tests!
      - run: pnpm run test:ci

      - codecov/upload:
          disable_search: true
          fail_on_error: true
          files: ./coverage/lcov.info

# Invoke jobs via workflows
# See: https://circleci.com/docs/2.0/configuration-reference/#workflows
workflows:
  test-package: # This is the name of the workflow, feel free to change it to better match your workflow.
    # Inside the workflow, you define the jobs you want to run.
    jobs:
      - build-test-package
