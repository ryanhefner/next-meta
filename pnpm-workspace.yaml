packages:
  - docs

autoInstallPeers: false
verifyDepsBeforeRun: false
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  # Explicitly selected Chakra Docs release; retain the age gate for other packages.
  - '@chakra-docs/chakra@0.3.0'
  - '@chakra-docs/core@0.3.0'
  - '@chakra-docs/next@0.3.0'
  - '@chakra-docs/search@0.3.0'
  - '@chakra-docs/shiki@0.3.0'
  - '@chakra-docs/source-filesystem@0.3.0'
  # Explicit security-patch exceptions retained from the npm configuration.
  - serialize-javascript
  - next
  - '@next/*'

allowBuilds:
  esbuild: true
  sharp: true

overrides:
  'brace-expansion@^1.1.7': 1.1.21
  'brace-expansion@^5.0.5': 5.0.12
  serialize-javascript: 7.1.2
