name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # npm trusted publisher: ryanhefner/next-meta, publish.yml, no environment.
  # Configure this relationship on npm; no stored npm token is required.
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "${EVENT_NAME}" = "release" ] && [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi

          if [[ "${PACKAGE_VERSION}" == *-* ]]; then
            NPM_DIST_TAG="next"
          else
            NPM_DIST_TAG="latest"
          fi

          echo "version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "dist-tag=${NPM_DIST_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Verify packed release
        run: pnpm run release:check

      - name: Dry-run package publish
        if: github.event_name == 'workflow_dispatch'
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish --access public --tag "${NPM_DIST_TAG}" --dry-run --ignore-scripts

      - name: Publish package
        if: github.event_name == 'release'
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish --access public --tag "${NPM_DIST_TAG}" --ignore-scripts
