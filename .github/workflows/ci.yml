name: Verify Package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run test:ci
      - run: npm run build
      - run: npm run test:integration
      - run: npm run build --workspace next-meta-docs
      - run: npm run docs:check

  packed-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        next: ['14', '15', '16']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run release:smoke
        env:
          NEXT_VERSION: ${{ matrix.next }}
