version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    cooldown:
      default-days: 14
      include:
        - '*'
    versioning-strategy: increase-if-necessary
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    cooldown:
      default-days: 14
      include:
        - '*'
    groups:
      github-actions:
        patterns:
          - '*'
